<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع التقارير العسكرية</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #5865F2;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #1e1e1e;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام رفع التقارير</h2>
        <form id="reportForm">
            <div class="form-group">
                <label for="adminId">ايدي المسؤول:</label>
                <input type="text" id="adminId" required placeholder="مثال: 773">
            </div>

            <div class="form-group">
                <label for="reportDetails">تفاصيل التقرير:</label>
                <textarea id="reportDetails" required placeholder="اكتب تفاصيل التقرير هنا..."></textarea>
            </div>

            <div class="form-group">
                <label for="reportFile">رفع صورة:</label>
                <input type="file" id="reportFile" accept="image/*">
            </div>

            <div class="form-group">
                <label for="videoUrl">رابط الفيديو (اختياري):</label>
                <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا (YouTube, Streamable...)">
            </div>

            <button type="submit" id="submitBtn">رفع التقرير</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1548139936127914095/EmhL6isWAj_fJlTPbRdd6E3RFy1fjzECrmb4Vt1_Uh3a3sEokkfH8Tor-FJ-5OGucSs0";

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const adminId = document.getElementById('adminId').value;
            const details = document.getElementById('reportDetails').value;
            const fileInput = document.getElementById('reportFile').files[0];
            const videoUrl = document.getElementById('videoUrl').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الإرسال...";

            const formData = new FormData();
            
            let messageContent = `🚨 **تقرير جديد تم رفعه!**\n👤 **ايدي المسؤول:** <@${adminId}>\n📄 **التفاصيل:**\n${details}`;
            
            if (videoUrl) {
                messageContent += `\n🎬 **رابط الفيديو:** ${videoUrl}`;
            }

            const payload = {
                content: messageContent
            };

            formData.append('payload_json', JSON.stringify(payload));

            if (fileInput) {
                formData.append('file', fileInput);
            }

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('تم رفع التقرير وإرساله إلى ديسورد بنجاح!');
                    document.getElementById('reportForm').reset();
                } else {
                    alert('حدث خطأ أثناء إرسال التقرير، تأكد من صحة الرابط.');
                }
            } catch (error) {
                console.error(error);
                alert('فشل الاتصال بالديسورد.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "رفع التقرير";
            }
        });
    </script>

</body>
</html>
